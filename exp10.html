<html>
<head>
<title>Mouse Over Event</title>
<style>
body {
text-align: center;
font-family: Arial;
background-color: lightblue;
padding-top: 50px;
}
img {
width: 350px;
height: 280px;
border-radius: 10px;
}
h2 {
color: darkblue;
}
</style>
</head>
<body>
<h2>Mouse Over Event </h2>
<div onmouseover="changeContent()" onmouseout="restoreContent()">
<img id="myImage" src="image1.jpg">
<h3 id="myText">Move Mouse Over Me</h3>
</div>
<script>
function changeContent() {
    document.getElementById("myImage").src="image2.jpeg";
    document.getElementById("myText").innerHTML="Welcome! You moved the mouse over the Me.";
}
function restoreContent() {
    document.getElementById("myImage").src="image1.jpeg";
    document.getElementById("myText").innerHTML ="Move Mouse Over Me";
}
</script>
</body>
</html>
